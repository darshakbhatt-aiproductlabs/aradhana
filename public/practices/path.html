<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Vāṇī · वाणी · Aradhana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css">
<style>
  html, body { overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; height: 100dvh; overflow: hidden; }

  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; }

  #cosmos { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #cosmos .orb {
    position: absolute; border-radius: 50%; filter: blur(36px); opacity: 0.5;
    animation: drift 16s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-22px) scale(1.08); }
  }

  #bgMedia { position: absolute; inset: 0; overflow: hidden; }
  #bgMedia img, #bgMedia video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
    display: none; opacity: 0.32; filter: saturate(0.9) contrast(1.05);
    transform: scale(1.08);
  }
  #bgMedia.has-image img, #bgMedia.has-video video { display: block; }
  body.playing #bgMedia.has-image img,
  body.playing #bgMedia.has-video video { animation: ken 28s ease-in-out infinite alternate; }
  @keyframes ken {
    from { transform: scale(1.08) translateY(0); }
    to { transform: scale(1.2) translateY(-4%); }
  }
  #wash {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255,246,232,0.55), rgba(255,232,240,0.42) 50%, rgba(232,244,255,0.62)),
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,224,160,0.55), transparent 60%);
  }

  #gaze { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #gaze .halo {
    position: absolute; left: 50%; top: -8%; width: 140%; height: 70%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 20%, rgba(255,208,96,0.55), transparent 58%);
    animation: breathe 5.2s ease-in-out infinite;
  }
  #gaze .bindu {
    position: absolute; left: 50%; top: 9%; width: 10px; height: 10px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 18px 8px color-mix(in srgb, var(--gold) 55%, transparent);
    animation: pulse 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.25); }
  }

  #screen {
    position: relative; z-index: 2; flex: 1; min-height: 0;
    margin: max(10px, var(--safe-top)) 12px 8px;
    border-radius: var(--radius-xl);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, color-mix(in srgb, var(--gold-soft) 55%, white), transparent 62%),
      linear-gradient(180deg, rgba(255,253,251,0.78), rgba(255,241,232,0.7) 55%, rgba(255,230,240,0.74));
    border: 2px solid color-mix(in srgb, var(--gold) 38%, white);
    box-shadow:
      0 0 0 6px color-mix(in srgb, var(--gold) 14%, transparent),
      0 22px 50px -18px color-mix(in srgb, var(--coral) 28%, transparent),
      inset 0 1px 0 rgba(255,255,255,0.95);
    cursor: pointer;
  }
  #screen::before {
    content: "";
    position: absolute; inset: 10px; border-radius: 20px; pointer-events: none;
    border: 1px solid color-mix(in srgb, var(--gold) 26%, transparent);
  }
  #grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
    background-image: radial-gradient(rgba(58,47,74,0.55) 0.6px, transparent 0.7px);
    background-size: 3px 3px;
  }

  #now {
    position: relative; z-index: 2; margin-top: 22px; text-align: center;
    padding: 0 18px; max-width: 90%;
  }
  #now .live {
    font-size: 10px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--coral); margin: 0 0 4px;
  }
  #now h1 {
    font-family: var(--dev); font-size: clamp(18px, 4.6vw, 26px); font-weight: 800;
    color: var(--coral-deep); margin: 0; letter-spacing: -0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #now .en { font-size: 12px; font-weight: 700; color: var(--mist); margin: 2px 0 0; }

  #word {
    position: relative; z-index: 2; flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 18px 0; width: 100%;
    pointer-events: none;
  }
  #giant {
    font-family: var(--dev); font-weight: 800;
    font-size: clamp(42px, 12vw, 84px); line-height: 1.12;
    color: var(--coral-deep); text-align: center;
    text-shadow: 0 1px 0 #fff, 0 0 36px color-mix(in srgb, var(--gold) 55%, transparent);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    max-width: 100%;
  }
  #giant.tick { transform: scale(1.05); }
  #line {
    margin-top: 14px; font-family: var(--dev); font-weight: 700;
    font-size: clamp(14px, 3.6vw, 20px); line-height: 1.55; text-align: center;
    color: var(--mist); max-width: 92%;
  }
  #line .on { color: var(--coral-deep); }
  #line .did { color: color-mix(in srgb, var(--ink) 45%, var(--mist)); }
  #ghost {
    margin-top: 8px; font-family: var(--dev); font-size: 13px; font-weight: 700;
    color: var(--mist); opacity: 0.45; min-height: 1.2em;
  }

  #playGate {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(255, 253, 251, 0.18);
  }
  #playGate.hidden { display: none; }
  #playGate button {
    width: 86px; height: 86px; border-radius: 50%; border: none;
    background: var(--coral); color: #fff;
    box-shadow: 0 12px 32px color-mix(in srgb, var(--coral) 40%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  #playGate button:active { transform: scale(0.96); }
  #playGate p { font-size: 13px; font-weight: 700; color: var(--mist); margin: 0; }

  #progress {
    position: relative; z-index: 2; width: 64%; height: 4px; margin: 8px auto 6px;
    border-radius: 99px; background: rgba(58, 47, 74, 0.08); overflow: hidden;
  }
  #bar { height: 100%; width: 0; border-radius: 99px; background: var(--coral); transition: width 0.25s; }

  #dock {
    position: relative; z-index: 3;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    padding: 6px 12px calc(var(--safe-bot) + 10px);
  }
  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%;
    border: var(--border); background: rgba(255, 253, 251, 0.92); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }
  .icon-btn.primary { background: var(--coral); color: #fff; border-color: transparent; }
  .icon-btn[aria-pressed="true"] { border-color: var(--coral); color: var(--coral-deep); }
  .icon-btn:disabled { opacity: 0.35; }

  #sheet {
    position: absolute; inset: 0; z-index: 20; display: none;
    background: rgba(58, 47, 74, 0.28);
  }
  #sheet.open { display: block; }
  #sheet .panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-height: 86%; overflow-y: auto;
    background: linear-gradient(180deg, var(--paper), var(--bg1));
    border-radius: 24px 24px 0 0;
    padding: 10px 16px calc(var(--safe-bot) + 18px);
    box-shadow: 0 -16px 40px rgba(58, 47, 74, 0.12);
  }
  .grab {
    width: 42px; height: 4px; border-radius: 99px; background: color-mix(in srgb, var(--coral-soft) 70%, white);
    margin: 4px auto 12px;
  }
  #sheet h2 {
    font-family: var(--display); font-size: 22px; font-weight: 800; text-align: center;
    margin: 0 0 4px; color: var(--coral-deep);
  }
  .albums {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;
  }
  .album {
    text-align: left; padding: 12px; border-radius: 16px; border: var(--border);
    background: rgba(255, 255, 255, 0.8); color: inherit; min-height: 92px;
    display: flex; flex-direction: column; justify-content: flex-end;
    box-shadow: var(--shadow);
  }
  .album.active { border-color: var(--coral); box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 22%, transparent); }
  .album .hi { font-family: var(--dev); font-size: 16px; font-weight: 800; color: var(--ink); }
  .album .en { font-size: 11px; font-weight: 700; color: var(--mist); margin-top: 2px; }
  .album.custom { border-style: dashed; align-items: center; justify-content: center; text-align: center; }

  #editor { display: none; }
  #editor.open { display: block; }
  #editor textarea, #editor input[type=text] {
    width: 100%; font-family: var(--dev); font-weight: 700; border-radius: 13px;
    border: var(--border); background: rgba(255,255,255,0.72); color: var(--coral-deep);
    outline: none; padding: 11px 12px;
  }
  #editor input[type=text] { font-size: 16px; text-align: center; margin-bottom: 8px; }
  #editor textarea { min-height: 150px; font-size: 16px; line-height: 1.65; resize: vertical; }
  #editor .row { display: flex; gap: 8px; margin-top: 10px; }
  #editor .row button { flex: 1; }

  .ghost {
    font-family: var(--ui); font-size: 13px; font-weight: 700; padding: 12px;
    border-radius: 13px; width: 100%; border: 2px dashed color-mix(in srgb, var(--coral-soft) 60%, transparent);
    background: rgba(255,255,255,0.55); color: var(--ink);
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="cosmos" aria-hidden="true">
      <div class="orb" style="width:240px;height:240px;background:#ffd0c0;top:-50px;left:-40px;"></div>
      <div class="orb" style="width:280px;height:280px;background:#cfe4ff;bottom:-70px;right:-50px;animation-delay:-5s;"></div>
      <div class="orb" style="width:170px;height:170px;background:#ffe08e;top:36%;right:6%;animation-delay:-9s;"></div>
    </div>
    <div id="bgMedia"><img id="bgImg" alt=""><video id="bgVid" muted loop playsinline></video></div>
    <div id="wash"></div>
    <div id="gaze" aria-hidden="true"><div class="halo"></div><div class="bindu"></div></div>

    <div id="screen" role="button" tabindex="0" aria-label="Advance the verse">
      <div id="grain"></div>
      <div id="now">
        <p class="live">Now playing</p>
        <h1 id="titleHi">गायत्री मंत्र</h1>
        <p class="en" id="titleEn">Gayatri Mantra</p>
      </div>
      <div id="word">
        <div id="giant">ॐ</div>
        <div id="line"></div>
        <div id="ghost"></div>
      </div>
      <div id="playGate">
        <button type="button" id="bigPlay" aria-label="Play">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72L19 12 8 5.14z"/></svg>
        </button>
        <p>Tap play · the verse walks itself</p>
      </div>
      <div id="progress"><div id="bar"></div></div>
    </div>

    <div id="dock">
      <button type="button" class="icon-btn" id="libBtn" aria-label="Hymn library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM18 5l-10 7 10 7z"/></svg>
      </button>
      <button type="button" class="icon-btn primary" id="cineBtn" aria-label="Play">
        <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72L19 12 8 5.14z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="nextBtn" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM6 5l10 7-10 7z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="voiceBtn" aria-label="Voice" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v18M8 8v8M16 8v8M4 10v4M20 10v4"/></svg>
      </button>
    </div>
  </div>

  <div id="sheet" role="dialog" aria-label="Choose a hymn">
    <div class="panel">
      <div class="grab"></div>
      <p class="kicker">वाणी</p>
      <h2>Choose a hymn</h2>
      <p class="lede">A divine screen. The Name walks, word by word — as if sung to you.</p>
      <div class="albums" id="albums"></div>
      <div id="editor">
        <span class="lbl">Your hymn</span>
        <input type="text" id="customTitle" placeholder="Title" value="मेरा पाठ">
        <textarea id="customVerses" placeholder="One line per line">ॐ
नमः शिवाय</textarea>
        <button type="button" class="ghost" id="bgBtn">Add a still or a film</button>
        <input type="file" id="bgInput" class="visually-hidden" accept="image/*,video/*">
        <div class="row">
          <button type="button" class="ghost" id="cancelEdit">Back</button>
          <button type="button" class="start" id="useCustom">Open on the screen</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const HYMNS = [
    {
      id: "gayatri",
      hi: "गायत्री मंत्र",
      en: "Gayatri Mantra",
      deity: "../deities/saraswati.webp",
      verses: "ॐ भूर्भुवः स्वः\nतत्सवितुर्वरेण्यं\nभर्गो देवस्य धीमहि\nधियो यो नः प्रचोदयात्",
    },
    {
      id: "maha",
      hi: "महामृत्युंजय",
      en: "Mahamrityunjaya",
      deity: "../deities/shiva.webp",
      verses: "ॐ त्र्यम्बकं यजामहे\nसुगन्धिं पुष्टिवर्धनम्\nउर्वारुकमिव बन्धनान्\nमृत्योर्मुक्षीय माऽमृतात्",
    },
    {
      id: "shiva",
      hi: "ॐ नमः शिवाय",
      en: "Om Namah Shivaya",
      deity: "../deities/shiva-meditating.webp",
      verses: "ॐ नमः शिवाय\nॐ नमः शिवाय\nॐ नमः शिवाय\nशिवोऽहम् शिवोऽहम्",
    },
    {
      id: "krishna",
      hi: "हरे कृष्ण",
      en: "Hare Krishna",
      deity: "../deities/krishna.webp",
      verses: "हरे कृष्ण हरे कृष्ण\nकृष्ण कृष्ण हरे हरे\nहरे राम हरे राम\nराम राम हरे हरे",
    },
    {
      id: "ganesha",
      hi: "गणेश वन्दना",
      en: "Ganesh Vandana",
      deity: "../deities/ganesha.webp",
      verses: "वक्रतुण्ड महाकाय\nसूर्यकोटि समप्रभ\nनिर्विघ्नं कुरु मे देव\nसर्वकार्येषु सर्वदा",
    },
    {
      id: "hanuman",
      hi: "हनुमान चालीसा",
      en: "Hanuman Chalisa · opening",
      deity: "../deities/hanuman.webp",
      verses: "श्रीगुरु चरन सरोज रज\nनिज मनु मुकुर सुधारि\nबरनउँ रघुबर बिमल जसु\nजो दायक फल चारि",
    },
    {
      id: "durga",
      hi: "सर्व मंगल",
      en: "Sarva Mangala",
      deity: "../deities/durga.webp",
      verses: "सर्वमङ्गलमाङ्गल्ये\nशिवे सर्वार्थसाधिके\nशरण्ये त्र्यम्बके गौरि\nनारायणि नमोऽस्तु ते",
    },
  ];

  const sheet = document.getElementById("sheet");
  const albums = document.getElementById("albums");
  const editor = document.getElementById("editor");
  const giant = document.getElementById("giant");
  const lineEl = document.getElementById("line");
  const ghost = document.getElementById("ghost");
  const bar = document.getElementById("bar");
  const screen = document.getElementById("screen");
  const playGate = document.getElementById("playGate");
  const cineBtn = document.getElementById("cineBtn");
  const playIcon = document.getElementById("playIcon");
  const voiceBtn = document.getElementById("voiceBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const bgMedia = document.getElementById("bgMedia");
  const bgImg = document.getElementById("bgImg");
  const bgVid = document.getElementById("bgVid");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PLAY_SVG = '<path d="M8 5.14v13.72L19 12 8 5.14z"/>';
  const PAUSE_SVG = '<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>';

  let words = [];
  let lines = [];
  let current = 0;
  let cine = false;
  let paused = false;
  let voiceOn = false;
  let timer = null;
  let activeId = "gayatri";
  let customUrl = null;

  function loadHymn(h) {
    stopCine(true);
    activeId = h.id;
    document.getElementById("titleHi").textContent = h.hi;
    document.getElementById("titleEn").textContent = h.en;
    lines = h.verses.split("\n").map((s) => s.trim()).filter(Boolean);
    words = [];
    lines.forEach((line, li) => {
      line.split(/\s+/).filter(Boolean).forEach((w) => words.push({ text: w, line: li }));
    });
    current = 0;
    setBackdrop(h.deity || null, false);
    render(true);
    playGate.classList.remove("hidden");
    document.querySelectorAll(".album").forEach((el) => {
      el.classList.toggle("active", el.dataset.id === h.id);
    });
  }

  function setBackdrop(src, isVideo) {
    bgMedia.classList.remove("has-image", "has-video");
    bgVid.pause();
    if (!src) return;
    if (isVideo) {
      bgVid.src = src;
      bgVid.load();
      bgMedia.classList.add("has-video");
    } else {
      bgImg.src = src;
      bgMedia.classList.add("has-image");
    }
  }

  function render(instant) {
    const w = words[current];
    if (!w) return;
    giant.textContent = w.text;
    if (!instant && !reduced) {
      giant.classList.remove("tick");
      void giant.offsetWidth;
      giant.classList.add("tick");
      setTimeout(() => giant.classList.remove("tick"), 280);
    }
    const line = lines[w.line] || "";
    const parts = line.split(/\s+/).filter(Boolean);
    let idx = 0;
    for (let i = 0; i < current; i++) if (words[i].line === w.line) idx++;
    lineEl.innerHTML = parts
      .map((t, i) => `<span class="${i === idx ? "on" : i < idx ? "did" : "yet"}">${t}</span>`)
      .join(" ");
    ghost.textContent = lines[w.line + 1] || "";
    bar.style.width = ((current + 1) / words.length) * 100 + "%";
    prevBtn.disabled = current <= 0;
    nextBtn.disabled = current >= words.length - 1;
    if (voiceOn) speak(w.text);
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "hi-IN";
      u.rate = 0.86;
      u.pitch = 1.12;
      u.volume = 0.72;
      const hi = window.speechSynthesis.getVoices().find((v) => v.lang.startsWith("hi"));
      if (hi) u.voice = hi;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  function step(n) {
    const next = current + n;
    if (next < 0 || next > words.length - 1) return false;
    current = next;
    render(false);
    if (current >= words.length - 1 && cine) stopCine(false);
    return true;
  }

  function interval() {
    return (voiceOn ? 1500 : 820) / 1;
  }
  function restartTimer() {
    if (timer) { clearInterval(timer); timer = null; }
    if (!cine || paused) return;
    timer = setInterval(() => { if (!step(1)) stopCine(false); }, interval());
  }
  function startCine() {
    cine = true;
    paused = false;
    document.body.classList.add("playing");
    playGate.classList.add("hidden");
    playIcon.innerHTML = PAUSE_SVG;
    cineBtn.setAttribute("aria-label", "Pause");
    if (current >= words.length - 1) current = 0;
    render(true);
    if (bgMedia.classList.contains("has-video")) bgVid.play().catch(() => {});
    restartTimer();
  }
  function stopCine() {
    cine = false;
    paused = false;
    if (timer) { clearInterval(timer); timer = null; }
    document.body.classList.remove("playing");
    playIcon.innerHTML = PLAY_SVG;
    cineBtn.setAttribute("aria-label", "Play");
  }

  HYMNS.forEach((h) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "album";
    b.dataset.id = h.id;
    b.innerHTML = `<span class="hi">${h.hi}</span><span class="en">${h.en}</span>`;
    b.addEventListener("click", () => {
      loadHymn(h);
      sheet.classList.remove("open");
    });
    albums.appendChild(b);
  });
  const customBtn = document.createElement("button");
  customBtn.type = "button";
  customBtn.className = "album custom";
  customBtn.dataset.id = "custom";
  customBtn.innerHTML = `<span class="hi">आपका पाठ</span><span class="en">Your own verses</span>`;
  customBtn.addEventListener("click", () => {
    albums.style.display = "none";
    editor.classList.add("open");
  });
  albums.appendChild(customBtn);

  document.getElementById("libBtn").addEventListener("click", () => {
    stopCine();
    albums.style.display = "";
    editor.classList.remove("open");
    sheet.classList.add("open");
  });
  sheet.addEventListener("click", (e) => {
    if (e.target === sheet) sheet.classList.remove("open");
  });
  document.getElementById("cancelEdit").addEventListener("click", () => {
    editor.classList.remove("open");
    albums.style.display = "";
  });
  document.getElementById("useCustom").addEventListener("click", () => {
    const verses = document.getElementById("customVerses").value.trim();
    if (!verses) return;
    loadHymn({
      id: "custom",
      hi: document.getElementById("customTitle").value.trim() || "वाणी",
      en: "Your hymn",
      deity: customUrl,
      verses,
    });
    sheet.classList.remove("open");
  });
  document.getElementById("bgBtn").addEventListener("click", () => {
    document.getElementById("bgInput").value = "";
    document.getElementById("bgInput").click();
  });
  document.getElementById("bgInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (customUrl) URL.revokeObjectURL(customUrl);
    customUrl = URL.createObjectURL(f);
    const isVid = /^video\//.test(f.type);
    setBackdrop(customUrl, isVid);
  });

  document.getElementById("bigPlay").addEventListener("click", (e) => {
    e.stopPropagation();
    startCine();
  });
  cineBtn.addEventListener("click", () => {
    if (!cine) startCine();
    else if (!paused) {
      paused = true;
      restartTimer();
      playIcon.innerHTML = PLAY_SVG;
    } else {
      paused = false;
      restartTimer();
      playIcon.innerHTML = PAUSE_SVG;
    }
  });
  prevBtn.addEventListener("click", () => { if (!cine) step(-1); });
  nextBtn.addEventListener("click", () => { if (!cine) step(1); });
  screen.addEventListener("click", (e) => {
    if (e.target.closest("#playGate")) return;
    if (!cine) {
      playGate.classList.add("hidden");
      step(1);
    }
  });
  screen.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (!cine) step(1);
    }
  });
  voiceBtn.addEventListener("click", () => {
    voiceOn = !voiceOn;
    voiceBtn.setAttribute("aria-pressed", voiceOn ? "true" : "false");
    if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    if (cine) restartTimer();
  });
  document.addEventListener("keydown", (e) => {
    if (sheet.classList.contains("open")) {
      if (e.key === "Escape") sheet.classList.remove("open");
      return;
    }
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); if (!cine) step(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); if (!cine) step(-1); }
    if (e.key === "Escape" && cine) stopCine();
  });

  loadHymn(HYMNS[0]);
})();
</script>
</body>
</html>
