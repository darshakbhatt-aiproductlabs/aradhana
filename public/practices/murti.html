<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Murti · मूर्ति पूजा · Aradhana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }

  #chooser, #variants {
    position: absolute; inset: 0; z-index: 30; overflow-y: auto;
    padding: var(--safe-top) 16px 28px;
    background: linear-gradient(165deg, var(--bg1), var(--bg2) 46%, var(--bg3));
  }
  #chooser.hidden, #variants.hidden, #waking.hidden { display: none; }
  h1 {
    font-family: var(--dev); font-size: 26px; font-weight: 800; text-align: center;
    margin: 4px 0 6px; color: var(--coral-deep);
  }
  .voice {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin: 0 auto 14px;
  }
  .voice .lbl {
    font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--mist);
  }
  .vbtn {
    font-family: var(--ui); font-size: 13px; font-weight: 800;
    padding: 8px 14px; border-radius: 999px; border: var(--border);
    background: rgba(255,253,251,0.92); color: var(--ink);
  }
  .vbtn.on { background: var(--coral); color: #fff; border-color: transparent; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 520px; margin: 0 auto; width: 100%; }
  .tile {
    position: relative; aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; padding: 0;
    border: var(--border); background: #fff6e8; box-shadow: var(--shadow); color: inherit;
  }
  .tile:active { transform: scale(0.96); }
  .tile img { width: 100%; height: 100%; object-fit: contain; object-position: center 58%; display: block; }
  .tile .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 6px 8px; text-align: center;
    background: linear-gradient(to top, rgba(58,47,74,0.72), transparent); color: #fff;
  }
  .tile .cap .hi { display: block; font-family: var(--dev); font-size: 13px; font-weight: 800; }
  .tile .cap .en { display: block; font-size: 10px; font-weight: 700; opacity: 0.9; }
  .upload-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-style: dashed; background: rgba(255,255,255,0.65); }
  .upload-tile .plus { font-family: var(--dev); font-size: 28px; color: var(--coral); line-height: 1; }

  #stage {
    position: absolute; inset: 0; overflow: hidden;
    visibility: hidden; pointer-events: none;
  }
  #stage.live { visibility: visible; pointer-events: auto; }
  #view3d {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; background: #fff1e8;
  }
  #hint {
    position: absolute; top: 10px; left: 58px; right: 58px; text-align: center;
    font-size: 11px; font-weight: 700; color: var(--mist); pointer-events: none; z-index: 4;
    opacity: 0.85; transition: opacity 0.7s ease;
  }
  #hint.gone { opacity: 0; }
  #backBtn, #cinemaBtn {
    position: absolute; top: 8px; z-index: 12;
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,253,251,0.94); border: var(--border);
    box-shadow: var(--shadow); color: var(--coral-deep); padding: 0;
  }
  #backBtn { left: 10px; }
  #cinemaBtn { right: 10px; }
  #backBtn svg, #cinemaBtn svg { width: 22px; height: 22px; }
  #hud {
    position: absolute; left: 12px; right: 12px; bottom: 136px; top: auto;
    z-index: 8; padding: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  #mantraHi {
    font-family: var(--dev); font-weight: 800; font-size: clamp(12px, 3.2vw, 15px);
    color: var(--coral-deep); margin: 0; pointer-events: auto; cursor: pointer;
    padding: 6px 12px; border-radius: 999px; line-height: 1.2;
    background: rgba(255,253,251,0.94); border: var(--border); display: inline-block;
    box-shadow: var(--shadow); max-width: 62%;
  }
  #hudMeta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: auto; }
  #mantraEn { font-size: 10px; font-weight: 700; color: var(--mist); margin: 0; text-align: right; }
  #caption { display: none; }
  #track {
    width: 72px; height: 4px; margin: 0; border-radius: 99px;
    background: rgba(58,47,74,0.1); overflow: hidden;
  }
  #fill { height: 100%; width: 0; background: var(--coral); border-radius: 99px; transition: width 0.4s; }
  #voiceStage { display: flex; gap: 4px; }
  #voiceStage .vbtn { padding: 5px 10px; font-size: 11px; }

  #thali {
    position: absolute; left: 0; right: 0; bottom: 58px; z-index: 8;
    display: flex; gap: 8px; padding: 0 12px; overflow-x: auto; scrollbar-width: none;
  }
  #thali::-webkit-scrollbar { display: none; }
  .offer {
    flex: 0 0 auto; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--ink); padding: 0;
  }
  .offer .dot {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,253,251,0.94);
    border: 2px solid color-mix(in srgb, var(--coral-soft) 55%, transparent);
    box-shadow: var(--shadow);
  }
  .offer .dot i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .offer .name { font-family: var(--dev); font-size: 10px; font-weight: 800; color: var(--mist); }
  .offer.now .dot { border-color: var(--coral); transform: scale(1.06); }
  .offer.done .dot { border-color: var(--gold); }
  .offer.done .name { color: var(--coral-deep); }

  #dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
    display: flex; gap: 8px; padding: 8px 12px 10px;
  }
  .tool {
    flex: 1; font-family: var(--ui); font-size: 13px; font-weight: 800; padding: 12px 8px;
    border-radius: 13px; border: var(--border); background: rgba(255,253,251,0.94); color: var(--ink);
  }
  .tool.primary { background: var(--coral); color: #fff; border-color: transparent; }
  .ghost {
    font-family: var(--ui); font-size: 13px; font-weight: 700; padding: 12px;
    border-radius: 13px; width: 100%; border: 2px dashed color-mix(in srgb, var(--coral-soft) 60%, transparent);
    background: rgba(255,255,255,0.55); color: var(--ink);
  }

  #done {
    position: absolute; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(255,246,232,0.72); backdrop-filter: blur(8px);
  }
  #done.show { display: flex; }
  #waking {
    position: absolute; inset: 0; z-index: 35;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,246,232,0.55); backdrop-filter: blur(6px);
  }
  #waking.hidden { display: none; }

  body.cinema #hint,
  body.cinema #hud,
  body.cinema #cinemaBtn { display: none; }
  body.cinema #thali { bottom: 58px; }
  body.cinema #dock { padding-bottom: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="chooser">
    <p class="kicker">मूर्ति पूजा</p>
    <h1>Living Murti</h1>
    <p class="lede">Choose a murti. Pour from the crown.</p>
    <div class="voice" role="group" aria-label="Voice">
      <span class="lbl">वाणी</span>
      <button type="button" class="vbtn" data-voice="male">Male</button>
      <button type="button" class="vbtn" data-voice="female">Female</button>
    </div>
    <div class="grid" id="grid"></div>
    <input type="file" id="fileInput" class="visually-hidden" accept="image/*" tabindex="-1" aria-hidden="true">
  </div>

  <div id="variants" class="hidden"></div>
  <div id="waking" class="hidden">
    <div class="card" style="margin:auto;text-align:center;">
      <p class="kicker">दर्शन</p>
      <p class="lede" style="margin-bottom:0;">The murti is taking form…</p>
    </div>
  </div>

  <div id="stage">
    <canvas id="view3d"></canvas>
    <button type="button" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button type="button" id="cinemaBtn" aria-label="Cinematic view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <p id="hint">Drag to walk around the murti</p>
    <div id="hud">
      <p id="mantraHi" title="Tap to chant"></p>
      <div id="hudMeta">
        <div id="voiceStage" role="group" aria-label="Voice">
          <button type="button" class="vbtn" data-voice="male">Male</button>
          <button type="button" class="vbtn" data-voice="female">Female</button>
        </div>
        <p id="mantraEn"></p>
        <div id="track"><div id="fill"></div></div>
      </div>
      <div id="caption">
        <p class="hi" id="capHi"></p>
        <p class="en" id="capEn"></p>
      </div>
    </div>
    <div id="thali" aria-label="Puja thali"></div>
    <div id="dock">
      <button type="button" class="tool primary" id="offerBtn">Pour jal on the crown</button>
    </div>
  </div>

  <div id="done">
    <div class="card">
      <p class="kicker">प्रणाम</p>
      <h2 style="font-family:var(--dev);color:var(--coral-deep);margin:6px 0;">The puja is complete</h2>
      <p class="lede">Sit with the murti. The offering of the mind is enough.</p>
      <button type="button" class="start" id="againBtn">Sit a little longer</button>
      <button type="button" class="ghost" id="anotherBtn" style="margin-top:8px;">Choose another</button>
    </div>
  </div>
</div>
<script type="module">
import { mountMurti, showDeity, playOffer, resize } from "./murti-scene.js?v=u3";

const STEP = {
  jal: { id: "jal", hi: "जल", en: "Pour jal on the crown", fx: "water", color: "#7eb7e0" },
  milk: { id: "milk", hi: "दुग्ध", en: "Pour milk on the crown", fx: "milk", color: "#f4efe4" },
  ghee: { id: "ghee", hi: "घृत", en: "Pour ghee on the crown", fx: "milk", color: "#f0d78c" },
  oil: { id: "oil", hi: "तैल", en: "Offer sesame oil", fx: "oil", color: "#6b4a1e" },
  chandan: { id: "chandan", hi: "चन्दन", en: "Sandal on the brow", fx: "chandan", color: "#e2c48a" },
  tilak: { id: "tilak", hi: "तिलक", en: "Tilak on the forehead", fx: "tilak", color: "#c4452d" },
  tripundra: { id: "tilak", hi: "त्रिपुण्ड्र", en: "Tripundra on the forehead", fx: "tilak", color: "#c4452d" },
  sindoor: { id: "tilak", hi: "सिन्दूर", en: "Sindoor on the brow", fx: "tilak", color: "#c4452d" },
  flowers: { id: "flowers", hi: "पुष्प", en: "Flowers on the head", fx: "flowers", color: "#f2b7a0" },
  white: { id: "flowers", hi: "श्वेत पुष्प", en: "White flowers on the head", fx: "flowers", color: "#f4efe4" },
  red: { id: "flowers", hi: "लाल पुष्प", en: "Red flowers on the head", fx: "flowers", color: "#d45b4a" },
  bilva: { id: "flowers", hi: "बिल्व", en: "Bilva leaves on the head", fx: "bilva", color: "#6a9a4a" },
  durva: { id: "flowers", hi: "दूर्वा", en: "Durva on the crown", fx: "bilva", color: "#6a9a4a" },
  tulsi: { id: "flowers", hi: "तुलसी", en: "Tulsi on the crown", fx: "bilva", color: "#3d8b5a" },
  dhoop: { id: "dhoop", hi: "धूप", en: "Offer incense", fx: "dhoop", color: "#c4b8a8" },
  aarti: { id: "aarti", hi: "आरती", en: "Circle the lamp", fx: "aarti", color: "#f0b040" },
  pranam: { id: "pranam", hi: "प्रणाम", en: "Bow to the murti", fx: "pranam", color: "#ff7a5c" },
  arghya: { id: "jal", hi: "अर्घ्य", en: "Offer arghya to Surya", fx: "water", color: "#7eb7e0" },
};

const FAMILIES = {
  ganesha: ["jal", "milk", "chandan", "tilak", "durva", "dhoop", "aarti", "pranam"],
  shiva: ["jal", "milk", "chandan", "tripundra", "bilva", "dhoop", "aarti", "pranam"],
  "shiva-lingam": ["jal", "milk", "chandan", "tripundra", "bilva", "dhoop", "aarti", "pranam"],
  vishnu: ["jal", "milk", "chandan", "tilak", "tulsi", "dhoop", "aarti", "pranam"],
  devi: ["jal", "milk", "chandan", "sindoor", "red", "dhoop", "aarti", "pranam"],
  "devi-sattva": ["jal", "milk", "chandan", "tilak", "white", "dhoop", "aarti", "pranam"],
  hanuman: ["jal", "sindoor", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
  murugan: ["jal", "milk", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
  ayyappa: ["jal", "ghee", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
  saura: ["arghya", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
  shani: ["jal", "oil", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
  brahma: ["jal", "milk", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
  datta: ["jal", "milk", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
  base: ["jal", "milk", "chandan", "tilak", "flowers", "dhoop", "aarti", "pranam"],
};

function stepsFor(p) {
  const keys = FAMILIES[p && p.family] || FAMILIES.base;
  return keys.map((k) => ({ ...STEP[k] }));
}

const chooser = document.getElementById("chooser");
const grid = document.getElementById("grid");
const thali = document.getElementById("thali");
const mantraHi = document.getElementById("mantraHi");
const mantraEn = document.getElementById("mantraEn");
const capHi = document.getElementById("capHi");
const capEn = document.getElementById("capEn");
const fill = document.getElementById("fill");
const offerBtn = document.getElementById("offerBtn");
const done = document.getElementById("done");
const fileInput = document.getElementById("fileInput");
const stage = document.getElementById("stage");

let MAIN = [];
let current = null;
let step = 0;
let doneSet = new Set();
let mounted = false;
let customUrl = null;
let STEPS = stepsFor({ family: "base" });
let selectGen = 0;
let voiceGender = localStorage.getItem("aradhana-voice") || "female";
let cinema = false;
let chantAudio = null;

function tile(p, host, onPick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile";
  if (p.src) {
    b.innerHTML = `<img src="${p.src}" alt="${p.en}" loading="lazy"><span class="cap"><span class="hi">${p.hi}</span><span class="en">${p.en}</span></span>`;
  } else {
    b.classList.add("upload-tile");
    b.innerHTML = `<span class="plus">+</span><span class="cap"><span class="hi">${p.hi}</span><span class="en">${p.en}</span></span>`;
  }
  b.addEventListener("click", () => onPick(p));
  host.appendChild(b);
}

function paintVoice() {
  document.querySelectorAll("[data-voice]").forEach((b) => {
    b.classList.toggle("on", b.dataset.voice === voiceGender);
  });
}
function setVoice(g) {
  voiceGender = g;
  try { localStorage.setItem("aradhana-voice", g); } catch (e) {}
  paintVoice();
}
document.querySelectorAll("[data-voice]").forEach((b) => {
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    setVoice(b.dataset.voice);
    if (current) speak(current.mantra);
  });
});
paintVoice();

function buildThali() {
  thali.innerHTML = "";
  STEPS.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "offer"; b.dataset.id = s.id;
    b.innerHTML = `<span class="dot"><i style="background:${s.color}"></i></span><span class="name">${s.hi}</span>`;
    b.addEventListener("click", () => doStep(i, true));
    thali.appendChild(b);
  });
}
buildThali();

function paint() {
  const s = STEPS[Math.min(step, STEPS.length - 1)];
  capHi.textContent = s.hi;
  capEn.textContent = s.en;
  offerBtn.textContent = doneSet.size >= STEPS.length ? "Complete" : s.en;
  fill.style.width = (doneSet.size / STEPS.length) * 100 + "%";
  document.querySelectorAll(".offer").forEach((el, i) => {
    el.classList.toggle("now", i === step && doneSet.size < STEPS.length);
    el.classList.toggle("done", doneSet.has(STEPS[i].id));
  });
}

async function ensureScene() {
  if (mounted) { resize(); return; }
  mountMurti(document.getElementById("view3d"));
  mounted = true;
}

function stopChant() {
  if (chantAudio) {
    try { chantAudio.pause(); } catch (e) {}
    chantAudio = null;
  }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function chantUrl(id) {
  const g = voiceGender === "male" ? "male" : "female";
  const key = id && id !== "custom" ? id : "om";
  return `../chants/${g}/${key}.mp3?v=u2`;
}

function speak() {
  stopChant();
  const id = (current && current.id) || "om";
  const a = new Audio(chantUrl(id));
  a.volume = 0.86;
  chantAudio = a;
  a.play().catch(() => {
    if (!current || !window.speechSynthesis) return;
    try {
      const u = new SpeechSynthesisUtterance(current.mantra);
      u.lang = "hi-IN";
      u.rate = 0.82;
      u.pitch = 1;
      u.volume = 0.7;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  });
}

function setCinema(on) {
  cinema = !!on;
  document.body.classList.toggle("cinema", cinema);
  try { parent.postMessage({ type: "aradhana-cinematic", on: cinema }, "*"); } catch (e) {}
}

function openChooser() {
  stopChant();
  setCinema(false);
  done.classList.remove("show");
  stage.classList.remove("live");
  chooser.classList.remove("hidden");
}

async function select(p) {
  const gen = ++selectGen;
  current = p;
  STEPS = stepsFor(p);
  buildThali();
  step = 0;
  doneSet = new Set();
  mantraHi.textContent = p.mantra;
  mantraEn.textContent = p.mantraEn;
  chooser.classList.add("hidden");
  done.classList.remove("show");
  stage.classList.add("live");
  paint();
  const waking = document.getElementById("waking");
  const hint = document.getElementById("hint");
  hint.classList.remove("gone");
  waking.classList.remove("hidden");
  try {
    await ensureScene();
    if (gen !== selectGen) return;
    await showDeity(p);
    if (gen !== selectGen) return;
  } finally {
    if (gen === selectGen) waking.classList.add("hidden");
  }
  speak();
  clearTimeout(hint._fade);
  hint._fade = setTimeout(() => hint.classList.add("gone"), 2600);
}

function doStep(i) {
  if (!current) return;
  const s = STEPS[i];
  if (!s) return;
  doneSet.add(s.id);
  playOffer(s.fx);
  if (s.fx === "pranam") speak();
  step = Math.min(i + 1, STEPS.length - 1);
  paint();
  if (doneSet.size >= STEPS.length) {
    setTimeout(() => done.classList.add("show"), 900);
  }
}

offerBtn.addEventListener("click", () => {
  if (doneSet.size >= STEPS.length) { done.classList.add("show"); return; }
  doStep(step);
});
mantraHi.addEventListener("click", () => { if (current) speak(); });
document.getElementById("backBtn").addEventListener("click", () => {
  if (cinema) { setCinema(false); return; }
  openChooser();
});
document.getElementById("cinemaBtn").addEventListener("click", () => setCinema(true));

function goRoot() {
  if (cinema) { setCinema(false); return; }
  openChooser();
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "aradhana-root") goRoot();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") goRoot();
});
document.getElementById("againBtn").addEventListener("click", () => done.classList.remove("show"));
document.getElementById("anotherBtn").addEventListener("click", openChooser);

fileInput.addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (customUrl) URL.revokeObjectURL(customUrl);
  customUrl = URL.createObjectURL(f);
  select({ id: "custom", hi: "इष्ट", en: "Ishta", src: customUrl, mantra: "ॐ", mantraEn: "Om", family: "base", crown: 0.06, brow: 0.24 });
});

async function boot() {
  try {
    const r = await fetch("./deities.json?v=u2");
    const data = await r.json();
    MAIN = data.deities || [];
  } catch (e) {
    MAIN = [];
  }
  grid.innerHTML = "";
  MAIN.forEach((p) => tile(p, grid, select));
  tile({ id: "custom", hi: "इष्ट", en: "Your image" }, grid, () => {
    fileInput.value = ""; fileInput.click();
  });
  paint();
}
boot();
</script>
