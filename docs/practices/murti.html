<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Murti · मूर्ति पूजा · Aradhana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }

  #chooser, #variants {
    position: absolute; inset: 0; z-index: 30; overflow-y: auto;
    padding: var(--safe-top) 16px 12px;
  }
  #chooser.hidden, #variants.hidden, #waking.hidden { display: none; }
  h1 {
    font-family: var(--dev); font-size: 28px; font-weight: 800; text-align: center;
    margin: 4px 0 6px; color: var(--coral-deep);
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 520px; margin: 0 auto; width: 100%; }
  .tile {
    position: relative; aspect-ratio: 2/3; border-radius: 16px; overflow: hidden; padding: 0;
    border: var(--border); background: #fff; box-shadow: var(--shadow); color: inherit;
  }
  .tile:active { transform: scale(0.96); }
  .tile img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .tile .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 6px 8px; text-align: center;
    background: linear-gradient(to top, rgba(58,47,74,0.72), transparent); color: #fff;
  }
  .tile .cap .hi { display: block; font-family: var(--dev); font-size: 13px; font-weight: 800; }
  .tile .cap .en { display: block; font-size: 10px; font-weight: 700; opacity: 0.9; }
  .upload-tile, .lingam-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .upload-tile { border-style: dashed; background: rgba(255,255,255,0.65); }
  .upload-tile .plus { font-family: var(--dev); font-size: 28px; color: var(--coral); line-height: 1; }
  .lingam-tile { background: linear-gradient(180deg, #fff6e8, #efe4d2); }
  .lingam-art {
    width: 42px; height: 70px; position: relative;
  }
  .lingam-art::before {
    content: ""; position: absolute; left: 50%; bottom: 8px; width: 36px; height: 12px;
    transform: translateX(-50%); border-radius: 40%; background: #e9dcc8;
    box-shadow: 0 0 0 2px #d4c4aa;
  }
  .lingam-art::after {
    content: ""; position: absolute; left: 50%; bottom: 16px; width: 16px; height: 42px;
    transform: translateX(-50%); border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, #4a4e58, #2e3138);
  }
  .back {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 800; color: var(--coral-deep);
    background: rgba(255,253,251,0.9); border: var(--border); border-radius: 999px;
    padding: 8px 14px; margin: 4px 0 8px;
  }

  #stage { position: absolute; inset: 0; overflow: hidden; }
  #view3d {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; background: #fff1e8;
  }
  #hint {
    position: absolute; top: 10px; left: 0; right: 0; text-align: center;
    font-size: 11px; font-weight: 700; color: var(--mist); pointer-events: none; z-index: 4;
  }
  #hud {
    position: absolute; left: 0; right: 0; top: 32px;
    text-align: center; z-index: 6; padding: 0 16px; pointer-events: none;
  }
  #mantraHi {
    font-family: var(--dev); font-weight: 800; font-size: clamp(13px, 3.4vw, 16px);
    color: var(--coral-deep); margin: 0; pointer-events: auto; cursor: pointer;
    padding: 5px 12px; border-radius: 999px;
    background: rgba(255,253,251,0.88); border: var(--border); display: inline-block;
  }
  #mantraEn { font-size: 11px; font-weight: 700; color: var(--mist); margin: 4px 0 0; }
  #caption { margin-top: 6px; }
  #caption .hi { font-family: var(--dev); font-size: 14px; font-weight: 800; color: var(--coral-deep); margin: 0; }
  #caption .en { font-size: 11px; font-weight: 700; color: var(--mist); margin: 2px 0 0; }
  #track {
    width: min(220px, 64vw); height: 4px; margin: 8px auto 0; border-radius: 99px;
    background: rgba(58,47,74,0.1); overflow: hidden;
  }
  #fill { height: 100%; width: 0; background: var(--coral); border-radius: 99px; transition: width 0.4s; }

  #thali {
    position: absolute; left: 0; right: 0; bottom: 58px; z-index: 8;
    display: flex; gap: 8px; padding: 0 12px; overflow-x: auto; scrollbar-width: none;
  }
  #thali::-webkit-scrollbar { display: none; }
  .offer {
    flex: 0 0 auto; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--ink); padding: 0;
  }
  .offer .dot {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,253,251,0.94);
    border: 2px solid color-mix(in srgb, var(--coral-soft) 55%, transparent);
    box-shadow: var(--shadow);
  }
  .offer .dot i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .offer .name { font-family: var(--dev); font-size: 10px; font-weight: 800; color: var(--mist); }
  .offer.now .dot { border-color: var(--coral); transform: scale(1.06); }
  .offer.done .dot { border-color: var(--gold); }
  .offer.done .name { color: var(--coral-deep); }

  #dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
    display: flex; gap: 8px; padding: 8px 12px 10px;
  }
  .tool {
    flex: 1; font-family: var(--ui); font-size: 13px; font-weight: 800; padding: 12px 8px;
    border-radius: 13px; border: var(--border); background: rgba(255,253,251,0.94); color: var(--ink);
  }
  .tool.primary { background: var(--coral); color: #fff; border-color: transparent; }
  .ghost {
    font-family: var(--ui); font-size: 13px; font-weight: 700; padding: 12px;
    border-radius: 13px; width: 100%; border: 2px dashed color-mix(in srgb, var(--coral-soft) 60%, transparent);
    background: rgba(255,255,255,0.55); color: var(--ink);
  }

  #done {
    position: absolute; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(255,246,232,0.72); backdrop-filter: blur(8px);
  }
  #done.show { display: flex; }
  #done .card { max-width: 340px; text-align: center; }
  #waking {
    position: absolute; inset: 0; z-index: 35;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,246,232,0.55); backdrop-filter: blur(6px);
  }
  #waking.hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="chooser">
    <p class="kicker">मूर्ति पूजा</p>
    <h1>Living Murti</h1>
    <p class="lede">One murti of each deity — as in the sanctum. Choose Shiva or the Shivling. Pour from the crown.</p>
    <div class="grid" id="grid"></div>
    <input type="file" id="fileInput" class="visually-hidden" accept="image/*" tabindex="-1" aria-hidden="true">
  </div>

  <div id="variants" class="hidden">
    <button type="button" class="back" id="varBack">All deities</button>
    <p class="kicker">शिव</p>
    <h1>Choose a form</h1>
    <div class="grid" id="varGrid"></div>
  </div>
  <div id="waking" class="hidden">
    <div class="card" style="margin:auto;text-align:center;">
      <p class="kicker">दर्शन</p>
      <p class="lede" style="margin-bottom:0;">The murti is taking form…</p>
    </div>
  </div>

  <div id="stage">
    <canvas id="view3d"></canvas>
    <p id="hint">Drag to walk around the murti</p>
    <div id="hud">
      <p id="mantraHi" title="Tap to chant"></p>
      <p id="mantraEn"></p>
      <div id="caption">
        <p class="hi" id="capHi"></p>
        <p class="en" id="capEn"></p>
      </div>
      <div id="track"><div id="fill"></div></div>
    </div>
    <div id="thali" aria-label="Puja thali"></div>
    <div id="dock">
      <button type="button" class="tool" id="changeBtn">← Deities</button>
      <button type="button" class="tool primary" id="offerBtn">Pour jal on the crown</button>
    </div>
  </div>

  <div id="done">
    <div class="card">
      <p class="kicker">प्रणाम</p>
      <h2 style="font-family:var(--dev);color:var(--coral-deep);margin:6px 0;">The puja is complete</h2>
      <p class="lede">Sit with the murti. The offering of the mind is enough.</p>
      <button type="button" class="start" id="againBtn">Sit a little longer</button>
      <button type="button" class="ghost" id="anotherBtn" style="margin-top:8px;">Choose another</button>
    </div>
  </div>
</div>
<script type="module">
import { mountMurti, showDeity, playOffer, resize } from "./murti-scene.js";

const MAIN = [
  { id: "ganesha", hi: "गणेश", en: "Ganesha", src: "../deities/ganesha.webp", mantra: "ॐ गं गणपतये नमः", mantraEn: "Om Gam Ganapataye Namah" },
  { id: "shiva", hi: "शिव", en: "Shiva", src: "../deities/shiva.webp", mantra: "ॐ नमः शिवाय", mantraEn: "Om Namah Shivaya" },
  { id: "shivling", hi: "शिवलिंग", en: "Shivling", lingam: true, mantra: "ॐ नमः शिवाय", mantraEn: "Om Namah Shivaya" },
  { id: "krishna", hi: "कृष्ण", en: "Krishna", src: "../deities/krishna.webp", mantra: "ॐ नमो भगवते वासुदेवाय", mantraEn: "Om Namo Bhagavate Vasudevaya" },
  { id: "durga", hi: "दुर्गा", en: "Durga", src: "../deities/durga.webp", mantra: "ॐ दुं दुर्गायै नमः", mantraEn: "Om Dum Durgayai Namah" },
  { id: "lakshmi", hi: "लक्ष्मी", en: "Lakshmi", src: "../deities/lakshmi.webp", mantra: "ॐ श्रीं महालक्ष्म्यै नमः", mantraEn: "Om Shreem Mahalakshmyai Namah" },
  { id: "hanuman", hi: "हनुमान", en: "Hanuman", src: "../deities/hanuman.webp", mantra: "ॐ हनुमते नमः", mantraEn: "Om Hanumate Namah" },
  { id: "saraswati", hi: "सरस्वती", en: "Saraswati", src: "../deities/saraswati.webp", mantra: "ॐ ऐं सरस्वत्यै नमः", mantraEn: "Om Aim Saraswatyai Namah" },
  { id: "rama", hi: "राम", en: "Rama", src: "../deities/rama.webp", mantra: "ॐ श्री रामाय नमः", mantraEn: "Om Shri Ramaya Namah" },
  { id: "kali", hi: "काली", en: "Kali", src: "../deities/kali.webp", mantra: "ॐ क्रिं कालीकायै नमः", mantraEn: "Om Krim Kalikayai Namah" },
];
const BASE_STEPS = [
  { id: "jal", hi: "जल", en: "Pour jal on the crown", fx: "water", color: "#7eb7e0" },
  { id: "milk", hi: "दुग्ध", en: "Pour milk on the crown", fx: "milk", color: "#f4efe4" },
  { id: "chandan", hi: "चन्दन", en: "Sandal paste from the brow", fx: "chandan", color: "#e2c48a" },
  { id: "tilak", hi: "तिलक", en: "Tilak on the forehead", fx: "tilak", color: "#c4452d" },
  { id: "flowers", hi: "पुष्प", en: "Flowers on the head", fx: "flowers", color: "#f2b7a0" },
  { id: "dhoop", hi: "धूप", en: "Offer incense", fx: "dhoop", color: "#c4b8a8" },
  { id: "aarti", hi: "आरती", en: "Circle the lamp", fx: "aarti", color: "#f0b040" },
  { id: "pranam", hi: "प्रणाम", en: "Bow to the murti", fx: "pranam", color: "#ff7a5c" },
];
const SHIVA_STEPS = [
  { id: "jal", hi: "जल", en: "Pour jal on the crown", fx: "water", color: "#7eb7e0" },
  { id: "milk", hi: "दुग्ध", en: "Pour milk on the crown", fx: "milk", color: "#f4efe4" },
  { id: "chandan", hi: "चन्दन", en: "Sandal on the lingam", fx: "chandan", color: "#e2c48a" },
  { id: "tilak", hi: "त्रिपुण्ड्र", en: "Tripundra on the stone", fx: "tilak", color: "#c4452d" },
  { id: "flowers", hi: "बिल्व", en: "Bilva leaves on the top", fx: "bilva", color: "#6a9a4a" },
  { id: "dhoop", hi: "धूप", en: "Offer incense", fx: "dhoop", color: "#c4b8a8" },
  { id: "aarti", hi: "आरती", en: "Circle the lamp", fx: "aarti", color: "#f0b040" },
  { id: "pranam", hi: "प्रणाम", en: "Bow to the murti", fx: "pranam", color: "#ff7a5c" },
];
const GANESHA_STEPS = [
  { id: "jal", hi: "जल", en: "Pour jal on the crown", fx: "water", color: "#7eb7e0" },
  { id: "milk", hi: "दुग्ध", en: "Pour milk on the crown", fx: "milk", color: "#f4efe4" },
  { id: "chandan", hi: "चन्दन", en: "Sandal on the brow", fx: "chandan", color: "#e2c48a" },
  { id: "tilak", hi: "तिलक", en: "Tilak on the forehead", fx: "tilak", color: "#c4452d" },
  { id: "flowers", hi: "दूर्वा", en: "Durva on the crown", fx: "bilva", color: "#6a9a4a" },
  { id: "dhoop", hi: "धूप", en: "Offer incense", fx: "dhoop", color: "#c4b8a8" },
  { id: "aarti", hi: "आरती", en: "Circle the lamp", fx: "aarti", color: "#f0b040" },
  { id: "pranam", hi: "प्रणाम", en: "Bow to the murti", fx: "pranam", color: "#ff7a5c" },
];
function stepsFor(p) {
  if (!p) return BASE_STEPS;
  if (p.id === "shivling" || p.lingam) return SHIVA_STEPS;
  if (p.id === "shiva") return [
    { id: "jal", hi: "जल", en: "Pour jal on the crown", fx: "water", color: "#7eb7e0" },
    { id: "milk", hi: "दुग्ध", en: "Pour milk on the crown", fx: "milk", color: "#f4efe4" },
    { id: "chandan", hi: "चन्दन", en: "Sandal on the brow", fx: "chandan", color: "#e2c48a" },
    { id: "tilak", hi: "त्रिपुण्ड्र", en: "Tripundra on the forehead", fx: "tilak", color: "#c4452d" },
    { id: "flowers", hi: "बिल्व", en: "Bilva leaves on the head", fx: "bilva", color: "#6a9a4a" },
    { id: "dhoop", hi: "धूप", en: "Offer incense", fx: "dhoop", color: "#c4b8a8" },
    { id: "aarti", hi: "आरती", en: "Circle the lamp", fx: "aarti", color: "#f0b040" },
    { id: "pranam", hi: "प्रणाम", en: "Bow to the murti", fx: "pranam", color: "#ff7a5c" },
  ];
  if (p.id === "ganesha") return GANESHA_STEPS;
  return BASE_STEPS;
}

const chooser = document.getElementById("chooser");
const variants = document.getElementById("variants");
const grid = document.getElementById("grid");
const varGrid = document.getElementById("varGrid");
const thali = document.getElementById("thali");
const mantraHi = document.getElementById("mantraHi");
const mantraEn = document.getElementById("mantraEn");
const capHi = document.getElementById("capHi");
const capEn = document.getElementById("capEn");
const fill = document.getElementById("fill");
const offerBtn = document.getElementById("offerBtn");
const done = document.getElementById("done");
const fileInput = document.getElementById("fileInput");

let current = null;
let step = 0;
let doneSet = new Set();
let mounted = false;
let customUrl = null;
let shivaAudio = null;
let STEPS = BASE_STEPS;

function tile(p, host, onPick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile" + (p.lingam ? " lingam-tile" : "");
  if (p.lingam) {
    b.innerHTML = `<div class="lingam-art" aria-hidden="true"></div><span class="cap"><span class="hi">${p.hi}</span><span class="en">${p.en}</span></span>`;
  } else if (p.src) {
    b.innerHTML = `<img src="${p.src}" alt="${p.en}" loading="lazy"><span class="cap"><span class="hi">${p.hi}</span><span class="en">${p.en}</span></span>`;
  } else {
    b.classList.add("upload-tile");
    b.innerHTML = `<span class="plus">+</span><span class="cap"><span class="hi">${p.hi}</span><span class="en">${p.en}</span></span>`;
  }
  b.addEventListener("click", () => onPick(p));
  host.appendChild(b);
}

MAIN.forEach((p) => tile(p, grid, select));
tile({ id: "custom", hi: "इष्ट", en: "Your image" }, grid, () => {
  fileInput.value = ""; fileInput.click();
});
fileInput.addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (customUrl) URL.revokeObjectURL(customUrl);
  customUrl = URL.createObjectURL(f);
  select({ id: "custom", hi: "इष्ट", en: "Ishta", src: customUrl, mantra: "ॐ", mantraEn: "Om" });
});

function buildThali() {
  thali.innerHTML = "";
  STEPS.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "offer"; b.dataset.id = s.id;
    b.innerHTML = `<span class="dot"><i style="background:${s.color}"></i></span><span class="name">${s.hi}</span>`;
    b.addEventListener("click", () => doStep(i, true));
    thali.appendChild(b);
  });
}
buildThali();

function paint() {
  const s = STEPS[Math.min(step, STEPS.length - 1)];
  capHi.textContent = s.hi;
  capEn.textContent = s.en;
  offerBtn.textContent = doneSet.size >= STEPS.length ? "Complete" : s.en;
  fill.style.width = (doneSet.size / STEPS.length) * 100 + "%";
  document.querySelectorAll(".offer").forEach((el, i) => {
    el.classList.toggle("now", i === step && doneSet.size < STEPS.length);
    el.classList.toggle("done", doneSet.has(STEPS[i].id));
  });
}

async function ensureScene() {
  if (mounted) { resize(); return; }
  mountMurti(document.getElementById("view3d"));
  mounted = true;
}

function chant(text, id) {
  if (id === "shiva" || id === "shivling" || id === "meditating") {
    try {
      if (!shivaAudio) {
        shivaAudio = new Audio("../deities/om-namah-shivaya.mp3");
        shivaAudio.volume = 0.7;
      }
      shivaAudio.currentTime = 0;
      shivaAudio.play().catch(() => speak(text));
      return;
    } catch (e) {}
  }
  speak(text);
}
function speak(text) {
  if (!window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "hi-IN"; u.rate = 0.82; u.pitch = 1.08; u.volume = 0.72;
    const hi = window.speechSynthesis.getVoices().find((v) => v.lang.startsWith("hi"));
    if (hi) u.voice = hi;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

async function select(p) {
  current = p;
  STEPS = stepsFor(p);
  buildThali();
  step = 0;
  doneSet = new Set();
  mantraHi.textContent = p.mantra;
  mantraEn.textContent = p.mantraEn;
  chooser.classList.add("hidden");
  variants.classList.add("hidden");
  done.classList.remove("show");
  paint();
  const waking = document.getElementById("waking");
  waking.classList.remove("hidden");
  try {
    await ensureScene();
    await showDeity(p);
  } finally {
    waking.classList.add("hidden");
  }
  chant(p.mantra, p.id);
}

function doStep(i, fromChip) {
  if (!current) return;
  const s = STEPS[i];
  if (!s) return;
  doneSet.add(s.id);
  playOffer(s.fx);
  if (s.fx === "pranam") chant(current.mantra, current.id);
  if (!fromChip) step = Math.min(i + 1, STEPS.length - 1);
  else step = Math.min(i + 1, STEPS.length - 1);
  paint();
  if (doneSet.size >= STEPS.length) {
    setTimeout(() => done.classList.add("show"), 900);
  }
}

offerBtn.addEventListener("click", () => {
  if (doneSet.size >= STEPS.length) { done.classList.add("show"); return; }
  doStep(step, false);
});
mantraHi.addEventListener("click", () => { if (current) chant(current.mantra, current.id); });
document.getElementById("changeBtn").addEventListener("click", () => {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (shivaAudio) { shivaAudio.pause(); }
  chooser.classList.remove("hidden");
});
function goRoot() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (shivaAudio) { shivaAudio.pause(); }
  done.classList.remove("show");
  variants.classList.add("hidden");
  chooser.classList.remove("hidden");
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "aradhana-root") goRoot();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") goRoot();
});
document.getElementById("againBtn").addEventListener("click", () => done.classList.remove("show"));
document.getElementById("anotherBtn").addEventListener("click", () => {
  done.classList.remove("show");
  chooser.classList.remove("hidden");
});
